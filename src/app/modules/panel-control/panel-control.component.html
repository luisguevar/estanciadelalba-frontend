<div class="card p-4">
    <!--begin::Card header-->
    <div class="card-header border-0 pt-6 p-4">
        <!--begin::Card title-->
        <div class="card-title">
            <!--begin::Search-->


            <div class="d-flex align-items-center position-relative my-1">


                <b>PANEL DE CONTROL</b>
                <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
                <!--  <span class="spinner-border spinner-border-sm align-middle ms-2"></span> -->
                <!--  <div class="d-flex align-items-center position-relative my-1">
                    <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-5"><span class="path1"></span><span
                            class="path2"></span></i> <input type="text" data-kt-customer-table-filter="search"
                        class="form-control form-control-solid w-250px ps-12" placeholder="Search Customers">
                </div> -->
            </div>
            <!--end::Search-->
        </div>
        <!--begin::Card title-->


        <!--begin::Card toolbar-->
        <div class="card-toolbar">
            <!--begin::Toolbar-->
            <div class="d-flex justify-content-end" data-kt-customer-table-toolbar="base">

                <!--The content below is only a placeholder and can be replaced.-->



                <!--   <button mat-raised-button color="accent" class="me-1" (click)="BotonNuevaHabitacion()">
                    <mat-icon>add_circle</mat-icon>
                    Habitación</button>
                <button mat-raised-button color="primary" class="mr-2 me-1" (click)="BotonGestionarTipos()">
                    <mat-icon>list</mat-icon> Tipos</button> -->
            </div>
            <!--end::Toolbar-->


        </div>
        <!--end::Card toolbar-->
    </div>

    <div class="card-body pt-0">


        <div class="row">

            <div class="col-12 mb-5">

                <div class="row">




                    <div class="col-2">
                        <div class="form-group row">
                            <div class="col-12">
                                <input class="form-control" type="datetime-local" placeholder="Check-in"
                                    [(ngModel)]="dpFechaIni" />
                            </div>
                            <label class="label-datepicket col-12 col-form-label">Buscar por fecha de inicio</label>
                        </div>
                    </div>

                    <div class="col-2">
                        <div class="form-group row">
                            <div class="col-12">
                                <input class="form-control" type="datetime-local" placeholder="Check-out"
                                    [(ngModel)]="dpFechaFin" />
                            </div>
                            <label class="label-datepicket col-12 col-form-label">Buscar por fecha de fin</label>
                        </div>
                    </div>



                    <div class="col-3 mt-1">

                        <button mat-raised-button color="primary" class="mr-2 me-2" (click)="BotonListarPanel()">
                            <mat-icon>refresh</mat-icon> Actualizar</button>
                        <!--  <button mat-raised-button color="accent" class="mr-2 me-2">
                            <mat-icon>add_circle</mat-icon> Reserva</button> -->


                    </div>
                    <!--  <div class="col-1 mt-1 ">


                    </div> -->
                </div>

            </div>
        </div>
        <div class="row">

            <div class="col-4 h-lg-50">
                <app-card-ingresos *ngIf="cPorcentajePendiente" cssClass="h-md-50 mb-5 mb-xl-10" description="Ingresos"
                    color="#98A3F4" [porcentaje]="cPorcentajePendiente" [nTotalPagosCompletos]="nTotalPagosCompletos"
                    [nEstanciasPendientesPago]="nEstanciasPendientesPago">
                </app-card-ingresos>
            </div>

            <div class="col-4 h-lg-50">
                <app-card-check-in *ngIf="cPorcentajeCheckInPendiente" cssClass="h-md-50 mb-5 mb-xl-10"
                    description="Check-in" color="#F56109" [cPorcentajeCheckInPendiente]="cPorcentajeCheckInPendiente"
                    [nTotalReservas]="nTotalReservas"
                    [nTotalPendienteCheckIn]="nTotalPendienteCheckIn"></app-card-check-in>

            </div>

            <div class="col-4 h-lg-50">
                <app-card-check-out *ngIf="cPorcentajeCheckOutPendiente" cssClass="h-md-50 mb-5 mb-xl-10"
                    description="Check-out" color="#2596be" [nTotalEstanciasConCheckOut]="nTotalEstanciasConCheckOut"
                    [nTotalEstanciasPorCheckOut]="nTotalEstanciasPorCheckOut"
                    [cPorcentajeCheckOutPendiente]="cPorcentajeCheckOutPendiente"></app-card-check-out>

            </div>




            <div class="col-12 mb-5">

                <!-- Componente Padre HTML -->
                <div class="row " *ngIf="chartPagos && chartReservas">
                    <div class="col-6">
                        <app-grafico-ingresos [chartData]="chartPagos"></app-grafico-ingresos>
                    </div>

                    <div class="col-6">
                        <app-grafico-reservas [chartData]="chartReservas"></app-grafico-reservas>
                    </div>

                </div>

            </div>
            <br>


        </div>


    </div>
</div>
