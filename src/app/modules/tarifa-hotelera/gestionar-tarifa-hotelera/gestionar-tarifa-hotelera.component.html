<div class="card p-4">
    <!--begin::Card header-->
    <div class="card-header border-0 pt-6 p-4">
        <!--begin::Card title-->
        <div class="card-title">
            <!--begin::Search-->
            <div class="d-flex align-items-center position-relative my-1">
                <b>TARIFA HOTELERA</b>
                <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
                <!--  <div class="d-flex align-items-center position-relative my-1">
                    <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-5"><span class="path1"></span><span
                            class="path2"></span></i> <input type="text" data-kt-customer-table-filter="search"
                        class="form-control form-control-solid w-250px ps-12" placeholder="Search Customers">
                </div> -->
            </div>
            <!--end::Search-->
        </div>
        <!--begin::Card title-->


        <!--begin::Card toolbar-->
        <div class="card-toolbar">


            <!--begin::Toolbar-->
            <div class="d-flex justify-content-end align-items-baseline" data-kt-customer-table-toolbar="base">

                <div>
                    <div class="form-group row">
                        <div class="col-10">
                            <input class="form-control" type="date" placeholder="Check-in"
                                [(ngModel)]="cFechaInicioSemana" (ngModelChange)="onFechaInicioChange()" />
                        </div>
                        <label class="label-datepicket col-12 col-form-label">Buscar por inicio de semana</label>
                    </div>

                </div>
                <button *ngIf="!bReadOnly" mat-raised-button color="accent" style="background-color: rgb(17, 177, 17);"
                    class="me-1" (click)="BotonTemporada()">
                    <mat-icon> attach_money</mat-icon>
                    Precio Temporadas</button>
                <button *ngIf="!bReadOnly" mat-raised-button color="accent" class="me-1"
                    (click)="BotonNuevaHabitacion()">
                    <mat-icon>add_circle</mat-icon>
                    Habitación</button>
                <button mat-raised-button color="primary" class="mr-2 me-1" (click)="BotonGestionarTipos()">
                    <mat-icon>list</mat-icon> Tipos</button>
            </div>


            <!--end::Toolbar-->


        </div>

        <!--end::Card toolbar-->
    </div>

    <div class="card-body pt-0">



        <div class="row">

            <div class="col-12">
                <div id="kt_customers_table_wrapper" class="dt-container dt-bootstrap5 dt-empty-footer">
                    <div class="table-responsive table-container">

                        <table class="table align-middle table-row-dashed fs-6 gy-5 w-100" id="kt_customers_table">
                            <colgroup>
                                <col data-dt-column="0">
                                <col data-dt-column="1">
                            </colgroup>
                            <thead>




                                <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="0"
                                        tabindex="0">
                                        <span class="dt-column-title">N° HAB</span>
                                        <span class="dt-column-order"></span>
                                    </th>
                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="1"
                                        tabindex="0">
                                        <span class="dt-column-title">TIPO HABITACIÓN</span>
                                        <span class="dt-column-order"></span>
                                    </th>
                                    <th></th>


                                    <th class="dt-orderable-asc dt-orderable-desc font-monospace gris text-center"
                                        data-dt-column="1" tabindex="0" *ngFor="let servicio of serviciosDisponibles">
                                        <span class="dt-column-title">
                                            <b>{{ servicio.cNombreServicio }} </b>
                                        </span>
                                        <span class="dt-column-order"></span>
                                    </th>


                                    <th></th>

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="0"
                                        tabindex="0" *ngFor="let dia of diasDisponibles">
                                        <span class="dt-column-title">{{ dia.cAbreviado }} <span
                                                style="    font-size: 9px;">{{ dia.cFechaAbrev }}</span></span>
                                        <span class="dt-column-order"></span>
                                    </th>
                                    <th></th>

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="1"
                                        tabindex="0">
                                        <span class="dt-column-title">DETALLES</span>
                                        <span class="dt-column-order"></span>
                                    </th>

                                </tr>
                            </thead>


                            <tbody class="fw-semibold text-gray-600">
                                <tr *ngFor="let habitacion of lstHabitaciones  | slice:desde:hasta; let i = index">

                                    <td class="fixed-column">
                                        <!-- (click)="BotonEditarHabitacion(habitacion)" -->
                                        <!--      <a class="text-gray-800 text-hover-primary mb-1 " role="button">{{
                                            habitacion.nNroHabitacion }}</a> -->
                                        <span class="text-gray-600 mb-1">
                                            {{ habitacion.nNroHabitacion }}
                                        </span>



                                    </td>
                                    <td class="fixed-column">
                                        <span class="text-gray-600 mb-1">{{
                                            habitacion.cNombreTipo
                                            }}</span>

                                    </td>
                                    <td>
                                        <span *ngIf="habitacion.nEstado== 2"
                                            class="mx-1 badge badge-light-warning fs-8 fw-bolder">
                                            Sucia
                                        </span>

                                        <span *ngIf="habitacion.nEstado== 0"
                                            class="mx-1 badge badge-light-primary fs-8 fw-bolder">
                                            Bloqueada
                                        </span>
                                    </td>
                                    <td *ngFor="let servicio of habitacion.lstServicios" class="text-center gris">
                                        <label class="checkbox">
                                            <input [disabled]="bReadOnly" type="checkbox"
                                                [(ngModel)]="servicio.bActivo" />
                                        </label>


                                    </td>

                                    <td></td>
                                    <td style="width: 6%;" *ngFor="let precio of habitacion.lstPrecios">
                                        <div class="form-group">
                                            <!--    <input type="number" class="form-control font-monospace"
                                                [value]="precio.nPrecio" [(ngModel)]="precio.nPrecio" /> -->
                                            <span>{{ precio.nPrecio }}</span>
                                        </div>
                                    </td>

                                    <td>

                                    </td>

                                    <td class="fixed-column">
                                        <a href="#" onclick="return false"
                                            (click)="BotonEditarHabitacion(habitacion)"><mat-icon>input</mat-icon></a>
                                    </td>






                                </tr>
                            </tbody>
                        </table>


                        <mat-paginator [length]="lstHabitaciones.length" [pageSize]="pageSize"
                            (page)="cambiarPagina($event)">
                        </mat-paginator>
                    </div>
                </div>
            </div>






        </div>


    </div>
</div>
<div class="d-flex justify-content-end" style="margin-top: 1%;" *ngIf="!bReadOnly">
    <button mat-raised-button color="primary" style="background-color: #1b84ff;" class="me-1" (click)="BotonGuardar()">
        <mat-icon>save</mat-icon>
        Guardar</button>
</div>
