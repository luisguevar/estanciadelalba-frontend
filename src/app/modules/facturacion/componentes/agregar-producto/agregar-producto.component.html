<div class="modal  d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">

                <h5 class="modal-title">Agregar Producto<span class="spinner-border spinner-border-sm align-middle ms-2"
                        *ngIf="isLoading$ | async"></span>
                </h5>
                <!-- <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <i aria-hidden="true" class="ki ki-close"></i>
                </button> -->

            </div>

            <div class="modal-body" *ngIf="!(isLoading$ | async)">
                <div class="row mb-3">
                    <div class="col-12">
                        <div class="form-group">
                            <label>Descripción del Producto: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Descripción del Producto"
                                [(ngModel)]="cDescripcionProducto" />

                        </div>
                    </div>


                </div>
                <div class="row mb-3">

                    <div class="col-6">
                        <div class="form-group">
                            <label>Cantidad: <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" placeholder="Cantidad" [(ngModel)]="nCantidad" />

                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group">
                            <label>Total Pagado: <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" placeholder="Cantidad" [(ngModel)]="nPrecio" />

                        </div>
                    </div>
                </div>



            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                    (click)="dialogRef.close(false)">Cerrar</button>
                <button type="button" class="btn btn-primary" (click)="BotonGuardar()">Guardar</button>
            </div>
        </div>
    </div>
</div>
