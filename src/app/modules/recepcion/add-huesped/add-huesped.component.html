<div class="modal  d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Agregar Huesped</h5>
                <!-- <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <i aria-hidden="true" class="ki ki-close"></i>
                </button> -->
            </div>
            <div class="modal-body">
                <div style="display: flex; justify-content: end;">
                    <div class="form-group">
                        <label style="color: grey;">Buscar por Nro Documento</label>
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Buscar por Nro Documento"
                                [(ngModel)]="cFilterNroDocumento" />
                            <div class="input-group-append">
                                <button class="btn btn-secondary" type="button"
                                    (click)="BuscarHuesped()">Buscar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <div class="row mt-2">
                    <div class="col-12">
                        <div class="row mb-3">
                            <div class="col-6">
                                <div class="form-group">
                                    <label>Nombres: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Nombres"
                                        [(ngModel)]="cNombres" />

                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Apellidos: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Apellidos"
                                        [(ngModel)]="cApellidos" />

                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">

                            <div class="col-6">
                                <div class="form-group ">
                                    <label>Tipo:</label>
                                    <select class="form-control" id="tipoHabitacionSelect" [(ngModel)]="nTipoDocumento">
                                        <option disabled [value]="0">Seleccione</option>
                                        <option *ngFor="let tipo of lstTipoDocumentos" [value]="tipo.nId">{{
                                            tipo.cNombre
                                            }}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Nro Documento: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Nro Documento"
                                        [(ngModel)]="cNroDocumento" />

                                </div>
                            </div>


                            <div class="col-12">
                                <div class="form-group">
                                    <label>Correo: </label>
                                    <input type="text" class="form-control" placeholder="Correo"
                                        [(ngModel)]="cCorreo" />

                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <div class="form-group ">
                                    <label>Pais Origen:</label>
                                    <select class="form-control" id="tipoHabitacionSelect" [(ngModel)]="pais_id">
                                        <option disabled [value]="0">Seleccione</option>
                                        <option *ngFor="let tipo of paises" [value]="tipo.id">{{
                                            tipo.cNombre
                                            }}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Celular contacto: </label>
                                    <input type="text" class="form-control" placeholder="Celular contacto"
                                        [(ngModel)]="cCelular" />

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                    (click)="dialogRef.close(false)">Cerrar</button>
                <button type="button" class="btn btn-primary" (click)="BotonAgregar()">Agregar</button>
            </div>
        </div>
    </div>
</div>
