<div class="modal  d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Agregar Huesped</h5>
                <!-- <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <i aria-hidden="true" class="ki ki-close"></i>
                </button> -->
            </div>
            <div class="modal-body">
                <div style="display: flex; justify-content: end;">
                    <div class="form-group">
                        <label style="color: grey;">Buscar por Nro Documento</label>
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Buscar por Nro Documento"
                                [(ngModel)]="cFilterNroDocumento" />
                            <div class="input-group-append">
                                <button class="btn btn-secondary" type="button"
                                    (click)="BuscarHuesped()">Buscar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <form [formGroup]="form">
                <div class="row mt-2">
                    <div class="col-12">
                        <div class="row mb-3">
                            <div class="col-6">
                                <div class="form-group">
                                    <label>Nombres: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Nombres"
                                        formControlName="cNombres"
                                        [class.is-invalid]="form.get('cNombres')?.invalid && form.get('cNombres')?.touched" />
                                    <div class="invalid-feedback">
                                        <span *ngIf="form.get('cNombres')?.errors?.['required']">El nombre es obligatorio.</span>
                                        <span *ngIf="form.get('cNombres')?.errors?.['minlength']">Mínimo 2 caracteres.</span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Apellidos: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Apellidos"
                                        formControlName="cApellidos"
                                        [class.is-invalid]="form.get('cApellidos')?.invalid && form.get('cApellidos')?.touched" />
                                    <div class="invalid-feedback">
                                        <span *ngIf="form.get('cApellidos')?.errors?.['required']">El apellido es obligatorio.</span>
                                        <span *ngIf="form.get('cApellidos')?.errors?.['minlength']">Mínimo 2 caracteres.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Tipo:</label>
                                    <select class="form-control" formControlName="nTipoDocumento">
                                        <option disabled [value]="0">Seleccione</option>
                                        <option *ngFor="let tipo of lstTipoDocumentos" [value]="tipo.nId">{{
                                            tipo.cNombre }}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Nro Documento: <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" placeholder="Nro Documento"
                                        formControlName="cNroDocumento"
                                        [class.is-invalid]="form.get('cNroDocumento')?.invalid && form.get('cNroDocumento')?.touched" />
                                    <div class="invalid-feedback">
                                        El nro de documento es obligatorio.
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <label>Correo:</label>
                                    <input type="text" class="form-control" placeholder="Correo"
                                        formControlName="cCorreo"
                                        [class.is-invalid]="form.get('cCorreo')?.invalid && form.get('cCorreo')?.touched" />
                                    <div class="invalid-feedback">
                                        Ingrese un correo válido.
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <div class="form-group">
                                    <label>Pais Origen:</label>
                                    <select class="form-control" formControlName="pais_id">
                                        <option disabled [value]="0">Seleccione</option>
                                        <option *ngFor="let tipo of paises" [value]="tipo.id">{{
                                            tipo.cNombre }}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <label>Celular contacto:</label>
                                    <input type="text" class="form-control" placeholder="Celular contacto"
                                        formControlName="cCelular" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                    (click)="dialogRef.close(false)">Cerrar</button>
                <button type="button" class="btn btn-primary" (click)="BotonAgregar()">Agregar</button>
            </div>
        </div>
    </div>
</div>
