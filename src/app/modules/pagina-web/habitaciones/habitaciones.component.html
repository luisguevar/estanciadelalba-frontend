<div class="card p-4">
    <!--begin::Card header-->
    <div class="card-header border-0 pt-6 p-4">
        <!--begin::Card title-->
        <div class="card-title">
            <!--begin::Search-->
            <div class="d-flex align-items-center position-relative my-1">

                <b>HABITACIONES</b>
                <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
                <!--  <div class="d-flex align-items-center position-relative my-1">
                    <i class="ki-duotone ki-magnifier fs-3 position-absolute ms-5"><span class="path1"></span><span
                            class="path2"></span></i> <input type="text" data-kt-customer-table-filter="search"
                        class="form-control form-control-solid w-250px ps-12" placeholder="Search Customers">
                </div> -->
            </div>
            <!--end::Search-->
        </div>
        <!--begin::Card title-->


        <!--begin::Card toolbar-->
        <div class="card-toolbar">
            <!--begin::Toolbar-->
            <div class="d-flex justify-content-end" data-kt-customer-table-toolbar="base">

                <!--   <button mat-raised-button color="accent" class="me-1" (click)="BotonNuevaHabitacion()">
                    <mat-icon>add_circle</mat-icon>
                    Habitación</button>
                <button mat-raised-button color="primary" class="mr-2 me-1" (click)="BotonGestionarTipos()">
                    <mat-icon>list</mat-icon> Tipos</button> -->
            </div>
            <!--end::Toolbar-->


        </div>
        <!--end::Card toolbar-->
    </div>

    <div class="card-body pt-0">



        <div class="row">


            <br>
            <div class="col-12 mt-2">
                <div id="kt_customers_table_wrapper" class="dt-container dt-bootstrap5 dt-empty-footer">
                    <div class="table-responsive table-container">

                        <table class="table align-middle table-row-dashed fs-6 gy-5 w-100" id="kt_customers_table">
                            <colgroup>
                                <col data-dt-column="0">
                                <col data-dt-column="1">
                                <col data-dt-column="2">
                                <col data-dt-column="3">
                                <col data-dt-column="4">
                                <col data-dt-column="5">
                                <col data-dt-column="6">
                                <col data-dt-column="7">
                            </colgroup>
                            <thead>




                                <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="0"
                                        tabindex="0">
                                        <span class="dt-column-title">NÚMERO</span>
                                        <span class="dt-column-order"></span>
                                    </th>

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="0"
                                        tabindex="0">
                                        <span class="dt-column-title"> HABITACIÓN</span>
                                        <span class="dt-column-order"></span>
                                    </th>




                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="1"
                                        tabindex="0">
                                        <span class="dt-column-title">TIPO HABITACIÓN</span>
                                        <span class="dt-column-order"></span>
                                    </th>

                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="2"
                                        tabindex="0">
                                        <span class="dt-column-title">NIVEL</span>
                                        <span class="dt-column-order"></span>
                                    </th>



                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="2"
                                        tabindex="0">
                                        <span class="dt-column-title">ESTADO</span>
                                        <span class="dt-column-order"></span>
                                    </th>
                                    <th class="dt-orderable-asc dt-orderable-desc fixed-column" data-dt-column="3"
                                        tabindex="0">
                                        <span class="dt-column-title">ACCIONES</span>
                                        <span class="dt-column-order"></span>
                                    </th>


                                </tr>
                            </thead>


                            <tbody class="fw-semibold text-gray-600">
                                <tr *ngFor="let habitacion of lstHabitaciones  | slice:desde:hasta; let i = index">


                                    <td class="fixed-column w-125px">
                                        <span class="text-gray-600  mb-1">{{
                                            habitacion.nNroHabitacion
                                            }}</span>

                                    </td>


                                    <td class="fixed-column w-225px ">
                                        <span class="text-gray-600 mb-1">
                                            <img [src]="habitacion.cImagen !== 'no-disponible' ? habitacion.cImagen : 'assets/img/no-disponible.jpg'"
                                                alt="Imagen de la habitación" width="100" height="100"
                                                style="width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 3px solid white;">
                                        </span>
                                    </td>


                                    <td class="fixed-column">
                                        <span class="text-gray-600  mb-1">{{
                                            habitacion.cNombreTipo
                                            }}</span>

                                    </td>

                                    <td class="fixed-column">
                                        <span class="text-gray-600  mb-1">

                                            {{
                                            habitacion.cNombreNivel
                                            }}</span>

                                    </td>





                                    <td class="fixed-column">


                                        <span *ngIf=" habitacion.nEstado == 1"
                                            class="badge badge-light-success fs-8 fw-bolder">
                                            Activo
                                        </span>
                                        <span *ngIf=" habitacion.nEstado == 0"
                                            class="badge badge-light-warning  fs-8 fw-bolder">
                                            Inactivo
                                        </span>

                                    </td>

                                    <td class="fixed-column">
                                        <a href="#" onclick="return false"
                                            (click)="BotonVerDetalleHabitacion(habitacion)"><mat-icon>input</mat-icon></a>
                                    </td>


                                </tr>
                            </tbody>
                        </table>


                        <mat-paginator [length]="lstHabitaciones.length" [pageSize]="pageSize"
                            (page)="cambiarPagina($event)">
                        </mat-paginator>
                    </div>
                </div>
            </div>

        </div>


    </div>
</div>
