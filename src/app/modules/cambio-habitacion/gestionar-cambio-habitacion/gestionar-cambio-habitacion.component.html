<div class="modal  d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cambiar Habitación </h5>
                <!--  <span class="spinner-border spinner-border-sm align-middle ms-2"></span> -->
            </div>
            <div class="modal-body">
                <div class="row">

                    <!-- <div style="display: flex; justify-content: right;">
                        <span>
                            <h5>Disponibilidad: {{ nTotalNochesReserva }}
                                <span *ngIf="nTotalNochesReserva != 1">noches.</span>
                                <span *ngIf="nTotalNochesReserva === 1">noche.</span>
                            </h5>
                        </span>
                    </div> -->

                    <div class="col-12 ">
                        <div class="card-body pt-0">


                            <div class="row mt-3 mb-2">


                                <div class="col-6">
                                    <div class="form-group row">
                                        <div class="col-12">
                                            <input class="form-control" type="datetime-local" [(ngModel)]="dpCheckIn"
                                                disabled placeholder="Check-in" />

                                        </div>
                                        <label class="label-datepicket col-12 col-form-label"> Check-in </label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-group row">
                                        <div class="col-12">
                                            <input class="form-control" type="datetime-local" [(ngModel)]="dpCheckOut"
                                                disabled placeholder="Check-out" />
                                        </div>
                                        <label class="label-datepicket col-12 col-form-label"> check-out
                                            programado</label>
                                    </div>
                                </div>
                            </div>




                        </div>
                    </div>

                    <div class="col-12 ">
                        <div class="card-body pt-0">

                            <div class="col-12 mb-2">
                                <div class="form-group row">
                                    <div class="col-9">
                                        <input disabled class="form-control" type="text" [(ngModel)]="cHabitacionActual"
                                            placeholder="Habitación Actual" />
                                        <label class="label-datepicket" for="exampleTextarea">Habitación Actual </label>
                                    </div>

                                    <div class="col-3">

                                        <select class="form-control" id="estado_id" [formControl]="cboEstado">
                                            <option *ngFor="let tipo of lstEstado" [value]="tipo.id">
                                                {{ tipo.cNombreEstado }}
                                            </option>
                                        </select>
                                        <label class="label-datepicket" for="exampleTextarea">Estado </label>
                                    </div>

                                </div>


                            </div>

                            <!-- Motivo Bloqueo solo si el estado es '0' -->
                            <div class="col-12 mt-2"
                                *ngIf="cboEstado.value !== '1' && cboEstado.value !== '2'  && cboEstado.value !== 1 && cboEstado.value !== 2">
                                <div class="form-group">

                                    <input type="text" class="form-control" placeholder="Motivo Bloqueo"
                                        [(ngModel)]="cMotivoBloqueo" />
                                    <label class="label-datepicket" for="exampleTextarea">Motivo Bloqueo </label>
                                </div>
                            </div>
                        </div>






                    </div>

                    <div class="col-12 ">
                        <div class="card-body pt-0">
                            <h4 class="mt-3">Detalles del cambio</h4>

                            <div class="row mt-3 mb-2">


                                <div class="col-3">
                                    <div class="form-group row">
                                        <div class="col-12">
                                            <label class="label-datepicket" for="nivelSelect">NIVEL</label>
                                            <select class="form-control" id="nivelSelect" [(ngModel)]="selectedNivel"
                                                (change)="onNivelChange()">
                                                <option value="0" disabled>NIVEL</option>
                                                <option *ngFor="let nivel of lstNivelesDisponibles" [value]="nivel.id">
                                                    {{ nivel.cNombreNivel }}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-9">
                                    <div class="form-group row">
                                        <div class="col-12">
                                            <label class="label-datepicket" for="habitacionSelect">HABITACIÓN</label>
                                            <select class="form-control" id="habitacionSelect"
                                                [(ngModel)]="selectedHabitacion">
                                                <option value="0" disabled>SELECCIONE UNA HABITACIÓN</option>
                                                <option *ngFor="let habitacion of lstHabitaciones"
                                                    [value]="habitacion.id">
                                                    {{ habitacion.cNombreTipo }} NRO: {{habitacion.nNroHabitacion}} -
                                                    PRECIO: S/ {{habitacion.
                                                    nPrecioTotal
                                                    }}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>




                        </div>
                    </div>

                    <div class="col-12 ">
                        <div class="card-body pt-0">

                            <div class="row mt-3 mb-2">
                                <div class="col-6">
                                    <label>
                                        <input type="radio" name="ajustePrecio" [checked]="bCambioPrecio"
                                            (change)="onCambioPrecioSeleccionado(true)">
                                        Usar Precio de Nueva Habitación
                                    </label>
                                </div>
                                <div class="col-6">
                                    <label>
                                        <input type="radio" name="ajustePrecio" [checked]="!bCambioPrecio"
                                            (change)="onCambioPrecioSeleccionado(false)">
                                        Mantener el Precio de Habitación Original
                                    </label>
                                </div>
                            </div>





                        </div>
                    </div>

                    <div class="col-12 ">
                        <div class="card-body pt-0">

                            <div class="row mt-3 mb-2">
                                <div class="form-group">

                                    <input type="text" class="form-control" placeholder="Motivo Cambio"
                                        [(ngModel)]="cMotivoCambio" />
                                    <label class="label-datepicket" for="exampleTextarea">Motivo Cambio </label>
                                </div>


                            </div>
                        </div>





                    </div>


                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                    (click)="dialogRef.close(false)">Cerrar</button>
                <button type="button" class="btn btn-primary" (click)="BotonGuardarCambio()">Guardar</button>
            </div>
        </div>
    </div>
</div>
