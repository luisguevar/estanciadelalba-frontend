    <!--begin::Card body-->
    <div class="card-body pt-0">

        <!--begin::Table-->
        <div id="kt_customers_table_wrapper" class="dt-container dt-bootstrap5 dt-empty-footer">
            <div id="" class="table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-5 dataTable" id="kt_customers_table"
                    style="width: 100%;">
                    
                    <thead>
                        <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0">
                            <th class="min-w-120px">N°</th>
                            <th class="min-w-250px">NOMBRE</th>
                            <th class="min-w-120px">DNI</th>
                            <th class="min-w-250px">CORREO</th>
                            <th class="min-w-200px">ROL</th>
                            <th class="min-w-120px">ESTADO</th>
                            <th class="min-w-150px">FECHA REGISTRO</th>
                            <th class="min-w-150px">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody class="fw-semibold text-gray-600">
                        <tr *ngFor="let usuario of usuariosPagina; let i = index">
                            <td>{{ (paginaActual - 1) * registrosPorPagina + (i + 1) }}</td>

                            <td>{{ usuario.name }}</td>
                            <td>{{ usuario.dni }}</td>
                            <td>{{ usuario.email }}</td>
                            <td>{{ usuario.cNombreRol }}</td>
                            <td>
                                <span class="badge badge-light-success" *ngIf="usuario.estado == 1">Activo</span>
                                <span class="badge badge-light-warning" *ngIf="usuario.estado == 0">Inactivo</span>
                            </td>
                            <td>{{ usuario.created_at | date:'dd/MM/yyyy HH:mm' }}</td>
                            <!--   <td>
                                <a href="#" class="btn btn-sm btn-light btn-active-light-primary"> Editar</a>
                                <a href="#" class="btn btn-sm btn-light btn-active-light-danger ms-2">Eliminar</a>
                            </td> -->
                            <td class="d-flex gap-2">
                                <button class="btn btn-sm btn-light-primary" (click)="BotonEditarUsuario(usuario)">
                                    <span *ngIf="bPermisoEdicion">Editar</span>
                                    <span *ngIf="!bPermisoEdicion">Detalles</span>
                                </button>
                               
                            </td>


                        </tr>
                    </tbody>


                    <tfoot></tfoot>
                </table>
            </div>
            <div class="row align-items-center">
                <!-- Selector de cantidad por página -->
                <div class="col-sm-12 col-md-5 mb-2 mb-md-0">
                    <!--   <label for="registrosPorPagina" class="me-2">Mostrar</label> -->
                    <select id="registrosPorPagina" class="form-select form-select-solid form-select-sm w-auto"
                        [(ngModel)]="registrosPorPagina" (change)="cambiarRegistrosPorPagina(registrosPorPagina)">
                        <option *ngFor="let opcion of opcionesPorPagina" [value]="opcion">
                            {{ opcion }}
                        </option>
                    </select>
                    <!--  <span class="ms-2">registros por página</span> -->
                </div>

                <!-- Paginación -->
                <div class="col-sm-12 col-md-7 d-flex align-items-center justify-content-center justify-content-md-end">
                    <div class="dt-paging paging_simple_numbers">
                        <nav aria-label="pagination">
                            <ul class="pagination">
                                <!-- Botón Anterior -->
                                <li class="dt-paging-button page-item" [class.disabled]="paginaActual === 1">
                                    <button class="page-link previous" (click)="cambiarPagina(paginaActual - 1)"
                                        [disabled]="paginaActual === 1">
                                        <i class="previous"></i>
                                    </button>
                                </li>

                                <!-- Números de página -->
                                <li class="dt-paging-button page-item" *ngFor="let p of paginas"
                                    [class.active]="p === paginaActual">
                                    <button class="page-link" (click)="cambiarPagina(p)"
                                        [attr.aria-current]="p === paginaActual ? 'page' : null">
                                        {{ p }}
                                    </button>
                                </li>

                                <!-- Botón Siguiente -->
                                <li class="dt-paging-button page-item" [class.disabled]="paginaActual === totalPaginas">
                                    <button class="page-link next" (click)="cambiarPagina(paginaActual + 1)"
                                        [disabled]="paginaActual === totalPaginas">
                                        <i class="next"></i>
                                    </button>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>


        </div>
        <!--end::Table-->
    </div>
    <!--end::Card body-->
</div>
